<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Who Am I? app icon</title>
  <desc id="desc">A cyan question mark inside a glowing visor on a midnight blue background.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#174657"/>
      <stop offset="0.55" stop-color="#0b2636"/>
      <stop offset="1" stop-color="#050912"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b2f7fb" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#73e0eb" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#123842" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#background)"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="#73e0eb" stroke-opacity="0.16" stroke-width="2"/>
  <path d="M112 166C150 134 362 134 400 166L414 256 400 346C362 378 150 378 112 346L98 256Z"
        fill="url(#visor)" stroke="#73e0eb" stroke-width="8" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M207 219C207 184 229 163 263 163 296 163 318 183 318 213 318 239 304 252 281 266 263 277 256 290 256 311"
        fill="none" stroke="#f4feff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="256" cy="348" r="13" fill="#f4feff" filter="url(#glow)"/>
</svg>
